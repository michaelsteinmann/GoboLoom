<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920">
  <!-- Additive RGB mixing: each square is one gobo. mix-blend-mode: screen makes the SVG itself
       preview the same mixing and tells GoboLoom to keep each color's full square. -->
  <g style="mix-blend-mode: screen">
    <rect x="210" y="40" width="580" height="580" fill="#ff0000" style="mix-blend-mode: screen" />
    <rect x="45" y="325" width="580" height="580" fill="#00ff00" style="mix-blend-mode: screen" />
    <rect x="375" y="325" width="580" height="580" fill="#0000ff" style="mix-blend-mode: screen" />
  </g>
</svg>
